<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Engine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f0f0;
    }
    #codeInput {
      width: 100%;
      height: 300px;
      padding: 10px;
      font-family: monospace;
    }
    #previewFrame {
      width: 100%;
      height: 600px;
      border: 2px solid #333;
      background: white;
    }
    button {
      padding: 10px 20px;
      margin: 10px 5px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Simple Game Engine</h1>
  <textarea id="codeInput" placeholder="// یہاں کوڈ لکھیں"></textarea>
  <div>
    <button onclick="saveCode()">Save</button>
    <button onclick="generateGame()">Run Game</button>
  </div>
  <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>

  <script>
    function saveCode() {
      localStorage.setItem('gameCode', document.getElementById('codeInput').value);
      alert('Code saved!');
    }

    function generateGame() {
      const code = document.getElementById('codeInput').value;
      document.getElementById('previewFrame').srcdoc = `
        <!DOCTYPE html>
        <html>
        <body>
          <canvas id="gameCanvas"></canvas>
          <script>
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 600;
            
            // Default game code if empty
            let gameCode = ${JSON.stringify(code) || `
              let x = 100, y = 100;
              function update() {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'red';
                ctx.fillRect(x, y, 50, 50);
              }
              update();
            `};
            
            try {
              eval(gameCode);
            } catch(err) {
              document.body.innerHTML = '<h2 style="color:red">Error: '+err.message+'</h2>';
            }
          <\/script>
        </body>
        </html>
      `;
    }

    // Load saved code
    window.onload = function() {
      const savedCode = localStorage.getItem('gameCode');
      if(savedCode) {
        document.getElementById('codeInput').value = savedCode;
      }
    };
  </script>
</body>
</html>
